[project]
name = "tomato-safety-demo"
version = "0.1.0"
description = "Tomato safety alignment metaphor demo — 3-model compare with real LoRA fine-tune"
requires-python = ">=3.10"
dependencies = [
    "accelerate",
    "datasets",
    "gradio>=5.0.0",
    "matplotlib>=3.10.9",
    "peft",
    "protobuf",
    "sentencepiece",
    "tiktoken",
    "torch",
    "transformers",
    "trl[peft]",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
]
